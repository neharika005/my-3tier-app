name: Ansible 3-Tier Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Install Ansible
    - name: Install Ansible
      run: |
        python -m pip install --upgrade pip
        pip install ansible

    # 4. Add SSH key for EC2 access
    - name: Add SSH key
      uses: webfactory/ssh-agent@v0.8.1
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    # 5. Run Ansible playbook
    - name: Run playbook
      run: |
        ansible-playbook -i ansible/slaves.txt ansible/playbook.yml --become
